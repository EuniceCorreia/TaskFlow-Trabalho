server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Esconde a versão do nginx nas respostas
    server_tokens off;

    # React (SPA): qualquer rota volta para o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mesma ideia do proxy do vite.config.js, mas apontando para o
    # Service do backend dentro do cluster
    location /api/ {
        proxy_pass http://taskflow-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
