# Projeto no SonarQube Cloud
sonar.organization=eunicecorreia
sonar.projectKey=EuniceCorreia_TaskFlow-Trabalho
sonar.projectName=TaskFlow Frontend

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx
sonar.exclusions=src/**/*.test.js,src/**/*.test.jsx
sonar.coverage.exclusions=src/main.jsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Faz o job falhar se o Quality Gate falhar
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300